name: Publish to Maven Central

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'     # v1.0.0, v1.2.3
      - 'v[0-9]+.[0-9]+.[0-9]+-*'   # pre-releases: v2.0.0-beta1, v2.1.0-rc1

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Strip leading v from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Tag must match the version in plugin/build.gradle.kts
        run: |
          grep -q "^version = \"${{ steps.version.outputs.VERSION }}\"$" plugin/build.gradle.kts \
            || { echo "Tag ${GITHUB_REF_NAME} does not match plugin/build.gradle.kts"; grep '^version' plugin/build.gradle.kts; exit 1; }

      - name: Run tests
        run: ./gradlew :plugin:check

      - name: Publish to Maven Central
        run: ./gradlew :plugin:publishAndReleaseToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
