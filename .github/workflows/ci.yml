name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'   # weekly: catches upstream Gradle / GitHub changes
  workflow_dispatch:

jobs:
  check:
    name: Check (${{ matrix.os }}, JDK ${{ matrix.java }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java: ['17']
        include:
          - os: ubuntu-latest
            java: '21'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit and functional tests (includes the Android scenario when an SDK is present)
        run: ./gradlew check
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}-jdk${{ matrix.java }}
          path: plugin/build/reports/tests

  gradle-compat:
    name: Gradle ${{ matrix.gradle }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported, early 8.x, newest 8.x, current 9.x
        gradle: ['7.6.6', '8.0.2', '8.14.6', '9.8.2']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Functional scenarios on Gradle ${{ matrix.gradle }}
        run: ./gradlew :plugin:functionalTest -PtestGradleVersion=${{ matrix.gradle }}
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-gradle-${{ matrix.gradle }}
          path: plugin/build/reports/tests

  real-remote:
    name: Real GitHub remotes
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: SSH key for the private repo test (optional)
        if: env.SSH_KEY != ''
        env:
          SSH_KEY: ${{ secrets.KLONE_TEST_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
      - name: Scenarios against github.com
        run: ./gradlew :plugin:functionalTest --tests '*RealRemoteScenario*'
        env:
          KLONE_REAL_REMOTE: 'true'
          KLONE_TEST_SSH_URL: ${{ secrets.KLONE_TEST_SSH_URL }}
          KLONE_TEST_SSH_TAG: ${{ secrets.KLONE_TEST_SSH_TAG }}
